version: v2
plugins:
  # Rust (tonic)
  - local: protoc-gen-prost
    out: gen/rust
    opt:
      - compile_well_known_types
  - local: protoc-gen-tonic
    out: gen/rust
  # TypeScript (protobuf-ts)
  - local: protoc-gen-ts
    out: gen/ts
    opt:
      - long_type_string
      - generate_dependencies
